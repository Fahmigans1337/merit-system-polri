services:
  db:
    image: postgres:16-alpine
    container_name: merit_polri_db
    environment:
      POSTGRES_USER: merituser
      POSTGRES_PASSWORD: merit2026
      POSTGRES_DB: merit_polri
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merituser -d merit_polri"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    container_name: merit_polri_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tabel dan data awal dibuat OTOMATIS saat container start (AUTO_SETUP)
      DATABASE_URL: postgresql+psycopg2://merituser:merit2026@db:5432/merit_polri
      SECRET_KEY: ${SECRET_KEY:-merit-system-polri-secret-key-2026-CHANGE-IN-PRODUCTION}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      AUTO_SETUP: "true"
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
